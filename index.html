<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Two Cars</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100vh;height:100dvh;background:#050510;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Cairo',sans-serif;position:fixed;top:0;left:0}
#gameContainer{position:relative;width:100%;max-width:450px;height:100%;height:100dvh;max-height:900px;background:linear-gradient(180deg,#1a1a40 0%,#0d0d2b 100%);box-shadow:0 0 40px rgba(0,0,0,.9),0 0 80px rgba(0,229,255,.08);overflow:hidden;border-radius:12px;border:1px solid rgba(100,150,255,.15)}

.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,25,.96);z-index:10;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px;text-align:center;transition:opacity .35s}
.hidden{opacity:0;pointer-events:none}

#startScreen h1{color:#fff;font-size:42px;margin-bottom:6px;text-shadow:0 0 25px #00e5ff,0 0 50px #00e5ff;letter-spacing:4px;font-weight:900}
#startScreen .subtitle{color:#8899bb;font-size:14px;margin-bottom:30px;font-weight:700}

.modeCards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
.modeCard{padding:20px;background:rgba(100,150,255,.08);border:2px solid #6b8cff;border-radius:16px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s;font-family:inherit;text-align:center;position:relative;overflow:hidden}
.modeCard::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transition:left .5s}
.modeCard:hover::before{left:100%}
.modeCard:hover{background:rgba(100,150,255,.18);transform:translateY(-2px);box-shadow:0 8px 30px rgba(107,140,255,.3)}
.modeCard:active{transform:scale(.97)}
.modeCard.thunder{border-color:#ff3366;background:rgba(255,51,102,.08)}
.modeCard.thunder:hover{background:rgba(255,51,102,.18);box-shadow:0 8px 30px rgba(255,51,102,.3)}
.modeIcon{font-size:44px;line-height:1}
.modeName{font-size:22px;font-weight:900;letter-spacing:1px}
.modeDesc{font-size:12px;color:#8899bb}
.modeBest{font-size:13px;color:#f1c40f;font-weight:900;margin-top:4px}

#gameOverScreen h1{color:#ff3366;font-size:54px;text-shadow:0 0 30px #ff3366,0 0 60px #ff3366;margin-bottom:12px;font-weight:900;letter-spacing:3px}
.scoreBox{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:18px 32px;margin-bottom:22px;color:#fff;font-size:17px;min-width:240px}
.scoreBox .big{font-size:36px;font-weight:900;display:inline-block}
.scoreBox .gold{color:#f1c40f;text-shadow:0 0 15px rgba(241,196,15,.7)}
.scoreBox .cyan{color:#00e5ff;text-shadow:0 0 15px rgba(0,229,255,.7)}
.btn{padding:14px 42px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(45deg,#ff3366,#ff6b81);border:none;border-radius:30px;cursor:pointer;box-shadow:0 6px 20px rgba(255,51,102,.45);font-family:inherit;margin-top:10px;touch-action:manipulation;transition:transform .1s,box-shadow .2s}
.btn:active{transform:scale(.95);box-shadow:0 3px 10px rgba(255,51,102,.4)}
.btn.secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.2);padding:10px 30px;font-size:16px}
.btn.secondary:active{background:rgba(255,255,255,.15)}

#scoreBoard{position:absolute;top:14px;left:0;width:100%;text-align:center;color:#fff;font-size:34px;font-weight:900;z-index:5;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none;transition:color .3s}
#scoreBoard.flash{animation:scoreFlash .35s ease-out}
@keyframes scoreFlash{0%{color:#fff}40%{color:#00e5ff;text-shadow:0 0 30px #00e5ff,0 0 60px #00e5ff}100%{color:#fff}}

#bestScoreTop{position:absolute;top:56px;left:0;width:100%;text-align:center;color:#f1c40f;font-size:13px;font-weight:700;z-index:5;opacity:.8;pointer-events:none;text-shadow:0 0 10px rgba(241,196,15,.5)}

#modeBadge{position:absolute;top:14px;right:12px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:900;background:rgba(0,229,255,.15);color:#00e5ff;border:1px solid #00e5ff;z-index:5;pointer-events:none;transition:all .3s}
#modeBadge.pulse{animation:badgePulse .7s ease-out}
@keyframes badgePulse{0%{transform:scale(1)}30%{transform:scale(1.35);box-shadow:0 0 25px currentColor}100%{transform:scale(1)}}

#challengeBanner{position:absolute;top:36%;left:0;width:100%;text-align:center;color:#fff;font-size:28px;font-weight:900;z-index:6;pointer-events:none;opacity:0;text-shadow:0 0 25px currentColor,0 0 50px currentColor;transition:opacity .4s;padding:0 20px}
#challengeBanner.show{opacity:1}

#damageFlash{position:absolute;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:7;border-radius:12px}
#damageFlash.active{animation:flashRed .6s ease-out}
@keyframes flashRed{0%{background:rgba(255,0,0,.7)}100%{background:rgba(255,0,0,0)}}

@keyframes crashShake{
    0%{transform:translate(0,0) rotate(0)}
    8%{transform:translate(-16px,-12px) rotate(-1deg)}
    16%{transform:translate(16px,12px) rotate(1deg)}
    24%{transform:translate(-20px,8px) rotate(-.8deg)}
    32%{transform:translate(20px,-8px) rotate(.8deg)}
    42%{transform:translate(-14px,-8px) rotate(-.5deg)}
    52%{transform:translate(14px,8px) rotate(.5deg)}
    65%{transform:translate(-8px,8px) rotate(-.3deg)}
    78%{transform:translate(8px,-8px) rotate(.3deg)}
    90%{transform:translate(-3px,3px) rotate(-.1deg)}
    100%{transform:translate(0,0) rotate(0)}
}
#gameContainer.crash-shake{animation:crashShake .75s cubic-bezier(.36,.07,.19,.97)}

canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>

<div id="gameContainer">
    <div id="scoreBoard">0</div>
    <div id="bestScoreTop">🏆 0</div>
    <div id="modeBadge">عادي</div>
    <div id="challengeBanner"></div>
    <div id="damageFlash"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <h1>TWO CARS</h1>
        <p class="subtitle">اختر المود</p>
        <div class="modeCards">
            <button class="modeCard" onclick="selectMode('classic')">
                <div class="modeIcon">🕹️</div>
                <div class="modeName">كلاسيكي</div>
                <div class="modeDesc">اللعبة الأصلية بدون إضافات</div>
                <div class="modeBest">🏆 <span id="bestClassic">0</span></div>
            </button>
            <button class="modeCard thunder" onclick="selectMode('thunder')">
                <div class="modeIcon">⚡</div>
                <div class="modeName">صاعقة</div>
                <div class="modeDesc">كل التحديات — وهم، ذاكرة، فوضى</div>
                <div class="modeBest">🏆 <span id="bestThunder">0</span></div>
            </button>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>OMG!</h1>
        <div class="scoreBox">
            <div>نتيجتك: <span id="finalScore" class="big cyan">0</span></div>
            <div style="margin-top:10px;">🏆 أعلى سكور (<span id="modeLabel">صاعقة</span>): <span id="bestScore" class="big gold">0</span></div>
        </div>
        <button class="btn" onclick="retryGame()">إعادة المحاولة</button>
        <button class="btn secondary" onclick="backToMenu()">القائمة الرئيسية</button>
    </div>
</div>

<script>
/* ===================== DOM ===================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.getElementById('gameContainer');
const scoreEl = document.getElementById('scoreBoard');
const bestScoreTopEl = document.getElementById('bestScoreTop');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreEl = document.getElementById('bestScore');
const modeLabelEl = document.getElementById('modeLabel');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const challengeBanner = document.getElementById('challengeBanner');
const modeBadge = document.getElementById('modeBadge');
const damageFlash = document.getElementById('damageFlash');
const bestClassicEl = document.getElementById('bestClassic');
const bestThunderEl = document.getElementById('bestThunder');

/* ===================== CONSTANTS ===================== */
const LANE_COUNT = 4;
const CAR_RADIUS = 18;
const CAR_W = 30;
const CAR_H = 50;

// Memory timing (frame-based, assumes 60fps)
const MEM_DISPLAY_EASY = 120;   // 2s
const MEM_DISPLAY_HARD = 60;    // 1s
const MEM_QUESTION_FRAMES = 30; // 0.5s
const MEM_MIN_REACTION = 45;    // ensure 0.75s reaction
const MEM_SPEED_EASY = 3.2;
const MEM_SPEED_HARD = 4.8;
const EASY_SCORE_RANGE = 30;    // 30 points of easy before hard
const MEM_BATCH_COOLDOWN = 30;
const MEM_BATCH_SPACING = 45;

// Spawn Y offsets (unified across all spawners)
const LEFT_Y = -50;
const RIGHT_Y = -150;

// Item cap for chaos
const MAX_ITEMS = 35;

/* ===================== STATE ===================== */
let gameMode = null; // 'classic' | 'thunder' | null
let isPlaying = false;
let canvasWidth = 0, canvasHeight = 0, laneWidth = 0;

let score = 0;
let bestScore = 0;
let frameCount = 0;
let lastSpawnFrame = -70; // 0.5s grace at start
let baseSpawnInterval = 100;
let gameSpeed = 4;
let currentMode = 0;
let modeEnteredAtScore = 0;
let lastMemoryBatchEndFrame = 0;
let animationId = null;

let shakeIntensity = 0;
let redFlash = 0;
let whiteFlash = 0;

let items = [];
let particles = [];
let memoryQueue = [];
let bannerState = { active: false, endFrame: 0 };

let leftCar  = { lane: 0, targetX: 0, currentX: 0, y: 0, color: '#ff3366' };
let rightCar = { lane: 2, targetX: 0, currentX: 0, y: 0, color: '#00e5ff' };

let audioCtx = null;

/* ===================== AUDIO ===================== */
function playSound(freq, dur, type, vol = 0.08) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}
function initAudio() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
}

/* ===================== RESIZE ===================== */
function resizeCanvas() {
    const w = gameContainer.clientWidth;
    const h = gameContainer.clientHeight;
    canvas.width = w;
    canvas.height = h;
    canvasWidth = w;
    canvasHeight = h;
    laneWidth = w / LANE_COUNT;
    leftCar.y = h - 110;
    rightCar.y = h - 110;
    leftCar.targetX = getLaneCenter(leftCar.lane);
    leftCar.currentX = leftCar.targetX;
    rightCar.targetX = getLaneCenter(rightCar.lane);
    rightCar.currentX = rightCar.targetX;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);

function getLaneCenter(lane) { return lane * laneWidth + laneWidth / 2; }

/* ===================== INPUT ===================== */
window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', handleInput, { passive: false });

function handleInput(e) {
    if (!isPlaying) return;
    if (e.target.closest && (e.target.closest('button') || e.target.closest('.overlay'))) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const rect = canvas.getBoundingClientRect();
    const clickX = clientX - rect.left;
    if (clickX < canvasWidth / 2) {
        leftCar.lane = leftCar.lane === 0 ? 1 : 0;
        leftCar.targetX = getLaneCenter(leftCar.lane);
        playSound(400, 0.05, 'sine', 0.05);
    } else {
        rightCar.lane = rightCar.lane === 2 ? 3 : 2;
        rightCar.targetX = getLaneCenter(rightCar.lane);
        playSound(600, 0.05, 'sine', 0.05);
    }
}

/* ===================== MODE SELECT ===================== */
function selectMode(mode) {
    initAudio();
    gameMode = mode;
    startScreen.classList.add('hidden');
    startGame();
}

function backToMenu() {
    isPlaying = false;
    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    gameMode = null;
    updateStartScreen();
    draw();
}

function updateStartScreen() {
    let classicBest = 0, thunderBest = 0;
    try {
        classicBest = parseInt(localStorage.getItem('twoCarsBest_classic') || '0');
        thunderBest = parseInt(localStorage.getItem('twoCarsBest_thunder') || '0');
    } catch(e) {}
    bestClassicEl.innerText = classicBest;
    bestThunderEl.innerText = thunderBest;
}

/* ===================== START / END / RESET ===================== */
function startGame() {
    resizeCanvas();
    gameOverScreen.classList.add('hidden');
    gameContainer.classList.remove('crash-shake');

    score = 0;
    gameSpeed = 4;
    items = [];
    particles = [];
    memoryQueue = [];
    frameCount = 0;
    lastSpawnFrame = -70;
    baseSpawnInterval = 100;
    currentMode = 0;
    modeEnteredAtScore = 0;
    lastMemoryBatchEndFrame = 0;
    shakeIntensity = 0;
    redFlash = 0;
    whiteFlash = 0;
    bannerState = { active: false, endFrame: 0 };
    challengeBanner.classList.remove('show');

    try {
        bestScore = parseInt(localStorage.getItem('twoCarsBest_' + gameMode) || '0');
    } catch(e) { bestScore = 0; }

    leftCar.lane = 0; rightCar.lane = 2;
    leftCar.targetX = getLaneCenter(0);
    rightCar.targetX = getLaneCenter(2);
    leftCar.currentX = leftCar.targetX;
    rightCar.currentX = rightCar.targetX;

    scoreEl.innerText = '0';
    bestScoreTopEl.innerText = '🏆 ' + bestScore;
    updateModeBadge();

    isPlaying = true;
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}

function endGame() {
    if (!isPlaying) return;
    isPlaying = false;

    // Dramatic crash
    whiteFlash = 1;
    redFlash = 1;
    shakeIntensity = 32;
    gameContainer.classList.remove('crash-shake');
    void gameContainer.offsetWidth;
    gameContainer.classList.add('crash-shake');
    triggerDamageFlash();

    // Multi-layer sounds
    playSound(150, 0.4, 'sawtooth', 0.15);
    setTimeout(() => playSound(80, 0.5, 'square', 0.12), 80);
    setTimeout(() => playSound(50, 0.7, 'triangle', 0.1), 180);

    // Big explosion particles
    const cx = canvasWidth / 2;
    const cy = canvasHeight - 110;
    spawnParticlesBurst(cx - laneWidth, cy, '#ff3366', 35);
    spawnParticlesBurst(cx + laneWidth, cy, '#00e5ff', 35);
    spawnParticlesBurst(cx, cy, '#ffffff', 25);
    spawnParticlesBurst(cx, cy, '#ff6b81', 20);
    spawnParticlesBurst(cx, cy, '#f1c40f', 15);

    // Update best
    if (score > bestScore) {
        bestScore = score;
        try { localStorage.setItem('twoCarsBest_' + gameMode, bestScore); } catch(e) {}
    }

    challengeBanner.classList.remove('show');

    setTimeout(() => {
        finalScoreEl.innerText = score;
        bestScoreEl.innerText = bestScore;
        modeLabelEl.innerText = gameMode === 'classic' ? 'كلاسيكي' : 'صاعقة';
        gameOverScreen.classList.remove('hidden');
    }, 450);
}

function retryGame() {
    if (!gameMode) return;
    startGame();
}

function triggerDamageFlash() {
    damageFlash.classList.remove('active');
    void damageFlash.offsetWidth;
    damageFlash.classList.add('active');
}

/* ===================== MODE TRANSITIONS ===================== */
function getModeFromScore(s) {
    if (gameMode === 'classic') return 0;
    if (s >= 300) return 3;
    if (s >= 200) return 2;
    if (s >= 100) return 1;
    return 0;
}

function checkModeTransition() {
    const newMode = getModeFromScore(score);
    if (newMode !== currentMode) {
        currentMode = newMode;
        modeEnteredAtScore = score;
        updateModeBadge();
        pulseBadge();
        announceMode(newMode);
    }
}

function updateModeBadge() {
    const M = {
        0: { t:'عادي',     c:'#00e5ff', bg:'rgba(0,229,255,.15)'    },
        1: { t:'👻 وهم',   c:'#a855f7', bg:'rgba(168,85,247,.18)'   },
        2: { t:'🧠 ذاكرة', c:'#f1c40f', bg:'rgba(241,196,15,.18)'   },
        3: { t:'🔥 فوضى',  c:'#ff3366', bg:'rgba(255,51,102,.18)'   }
    };
    const m = M[currentMode];
    modeBadge.innerText = m.t;
    modeBadge.style.color = m.c;
    modeBadge.style.borderColor = m.c;
    modeBadge.style.background = m.bg;
}

function pulseBadge() {
    modeBadge.classList.remove('pulse');
    void modeBadge.offsetWidth;
    modeBadge.classList.add('pulse');
}

function announceMode(mode) {
    const msgs = {
        1: { t:'👻 مستوى الوهم 👻',        c:'#a855f7' },
        2: { t:'🧠 مستوى الذاكرة 🧠',      c:'#f1c40f' },
        3: { t:'🔥 الفوضى الكاملة 🔥',     c:'#ff3366' }
    };
    if (!msgs[mode]) return;
    showBanner(msgs[mode].t, msgs[mode].c, 120);
    playSound(700, 0.35, 'triangle', 0.08);
}

function showBanner(text, color, duration = 90) {
    challengeBanner.innerText = text;
    challengeBanner.style.color = color;
    challengeBanner.classList.add('show');
    bannerState.active = true;
    bannerState.endFrame = frameCount + duration;
}

/* ===================== MEMORY HELPERS ===================== */
function isEasyMemory() {
    return (score - modeEnteredAtScore) < EASY_SCORE_RANGE;
}

function computeMemoryDisplay(baseDisplay, speed) {
    const distanceToCar = (canvasHeight - 110) - (-50);
    const totalFrames = Math.floor(distanceToCar / speed);
    const maxDisplay = Math.max(20, totalFrames - MEM_QUESTION_FRAMES - MEM_MIN_REACTION);
    return Math.min(baseDisplay, maxDisplay);
}

/* ===================== ITEM FACTORIES ===================== */
function makeItem(lane, type, side, opts = {}) {
    return {
        lane,
        x: getLaneCenter(lane),
        y: opts.y !== undefined ? opts.y : (side === 'left' ? LEFT_Y : RIGHT_Y),
        type,
        side,
        isFake: opts.isFake || false,
        isMemory: opts.isMemory || false,
        isQuestion: false,
        state: 'showing',
        revealed: false,
        speed: opts.speed || null,
        spawnFrame: frameCount,
        displayFrames: opts.displayFrames || 0,
        questionFrames: MEM_QUESTION_FRAMES
    };
}

function makeMemoryItem(lane, type, side, opts = {}) {
    const easy = isEasyMemory();
    const baseDisplay = easy ? MEM_DISPLAY_EASY : MEM_DISPLAY_HARD;
    const speed = easy ? MEM_SPEED_EASY : MEM_SPEED_HARD;
    const displayFrames = computeMemoryDisplay(baseDisplay, speed);
    return makeItem(lane, type, side, {
        ...opts,
        isMemory: true,
        speed: speed,
        displayFrames: displayFrames
    });
}

/* ===================== SPAWNERS ===================== */
function spawnNormal() {
    if (items.length >= MAX_ITEMS) return;
    const ll = Math.floor(Math.random() * 2);
    const rl = Math.floor(Math.random() * 2) + 2;
    items.push(makeItem(ll, Math.random() < 0.55 ? 'circle' : 'square', 'left'));
    items.push(makeItem(rl, Math.random() < 0.55 ? 'circle' : 'square', 'right'));
}

function spawnIllusion() {
    if (items.length >= MAX_ITEMS - 3) return;

    // LEFT SIDE: real in one lane, fake opposite type in the OTHER lane (adjacent)
    {
        const realLane = Math.random() < 0.5 ? 0 : 1;
        const fakeLane = 1 - realLane;
        const realIsCircle = Math.random() < 0.5;
        const realType = realIsCircle ? 'circle' : 'square';
        const fakeType = realIsCircle ? 'square' : 'circle';
        items.push(makeItem(realLane, realType, 'left', { y: LEFT_Y }));
        items.push(makeItem(fakeLane, fakeType, 'left', { y: LEFT_Y, isFake: true }));
    }

    // RIGHT SIDE: same logic, staggered Y
    {
        const realLane = Math.random() < 0.5 ? 2 : 3;
        const fakeLane = realLane === 2 ? 3 : 2;
        const realIsCircle = Math.random() < 0.5;
        const realType = realIsCircle ? 'circle' : 'square';
        const fakeType = realIsCircle ? 'square' : 'circle';
        items.push(makeItem(realLane, realType, 'right', { y: RIGHT_Y }));
        items.push(makeItem(fakeLane, fakeType, 'right', { y: RIGHT_Y, isFake: true }));
    }
}

function scheduleMemory() {
    if (items.length >= MAX_ITEMS - 3) return false;
    if (memoryQueue.length > 0) return false;
    if (frameCount - lastMemoryBatchEndFrame < MEM_BATCH_COOLDOWN) return false;

    const count = 2 + Math.floor(Math.random() * 2); // 2 or 3
    const sides = ['left', 'right'];
    if (count > 2) sides.push(Math.random() < 0.5 ? 'left' : 'right');
    // Shuffle
    for (let i = sides.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sides[i], sides[j]] = [sides[j], sides[i]];
    }

    let delay = 0;
    for (let i = 0; i < count; i++) {
        const side = sides[i];
        const lane = side === 'left'
            ? Math.floor(Math.random() * 2)
            : Math.floor(Math.random() * 2) + 2;
        const type = Math.random() < 0.5 ? 'circle' : 'square';
        memoryQueue.push({
            side, lane, type,
            spawnAt: frameCount + delay
        });
        delay += MEM_BATCH_SPACING;
    }
    lastMemoryBatchEndFrame = frameCount + delay;
    return true;
}

function processMemoryQueue() {
    for (let i = memoryQueue.length - 1; i >= 0; i--) {
        if (frameCount >= memoryQueue[i].spawnAt) {
            const m = memoryQueue[i];
            items.push(makeMemoryItem(m.lane, m.type, m.side, { y: LEFT_Y }));
            memoryQueue.splice(i, 1);
        }
    }
}

function spawnChaos() {
    if (items.length >= MAX_ITEMS - 3) return;
    const r = Math.random();
    if (r < 0.30) {
        spawnIllusion();
    } else if (r < 0.60) {
        if (!scheduleMemory()) spawnNormal();
    } else if (r < 0.90) {
        spawnNormal();
    } else {
        spawnPsycho();
    }
}

function spawnPsycho() {
    if (items.length >= MAX_ITEMS - 1) return;
    // Both sides: fake + memory (psycho item — always safe but shows ❓)
    for (const side of ['left', 'right']) {
        const lanes = side === 'left' ? [0, 1] : [2, 3];
        const lane = lanes[Math.floor(Math.random() * 2)];
        const type = Math.random() < 0.5 ? 'circle' : 'square';
        const item = makeMemoryItem(lane, type, side, { isFake: true });
        items.push(item);
    }
}

function spawnByMode() {
    switch (currentMode) {
        case 0: spawnNormal(); break;
        case 1: spawnIllusion(); break;
        case 2:
            if (!scheduleMemory()) spawnNormal();
            break;
        case 3: spawnChaos(); break;
    }
}

/* ===================== PARTICLES ===================== */
function spawnParticlesBurst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 10 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            color,
            size: Math.random() * 4 + 2
        });
    }
}
function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1,
            color,
            size: Math.random() * 4 + 2
        });
    }
}

/* ===================== MEMORY STATE ===================== */
function updateMemoryState(item, carY) {
    const elapsed = frameCount - item.spawnFrame;

    if (elapsed < item.displayFrames) {
        item.state = 'showing';
        item.isQuestion = false;
    } else if (elapsed < item.displayFrames + item.questionFrames) {
        item.state = 'question';
        item.isQuestion = true;
    } else {
        item.state = 'revealed';
        item.isQuestion = false;
        item.revealed = true;
    }

    // Safety: if too close to car and still in question, force reveal
    const dist = carY - item.y;
    const safetyDist = Math.min(150, canvasHeight * 0.2);
    if (item.state === 'question' && dist < safetyDist) {
        item.state = 'revealed';
        item.isQuestion = false;
        item.revealed = true;
    }
}

/* ===================== UPDATE ===================== */
function update() {
    // Effects always update (even after game over)
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.vx *= 0.985;
        p.life -= 0.018;
        if (p.life <= 0) particles.splice(i, 1);
    }
    if (whiteFlash > 0) whiteFlash -= 0.08;
    if (redFlash > 0) redFlash -= 0.022;
    if (shakeIntensity > 0.5) shakeIntensity *= 0.88;
    else shakeIntensity = 0;

    if (!isPlaying) return;

    frameCount++;

    // Car easing
    leftCar.currentX += (leftCar.targetX - leftCar.currentX) * 0.25;
    rightCar.currentX += (rightCar.targetX - rightCar.currentX) * 0.25;

    // Mode transition
    checkModeTransition();

    // Banner fade
    if (bannerState.active && frameCount > bannerState.endFrame) {
        challengeBanner.classList.remove('show');
        bannerState.active = false;
    }

    // Speed (both modes use same formula for consistent feel)
    gameSpeed = Math.min(10, 4 + score * 0.02);
    baseSpawnInterval = Math.max(55, 100 - score * 0.15);

    // Process queued memory items
    processMemoryQueue();

    // Spawn
    if (frameCount - lastSpawnFrame >= baseSpawnInterval) {
        spawnByMode();
        lastSpawnFrame = frameCount;
    }

    // Update items
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const actualSpeed = item.isMemory ? item.speed : gameSpeed;
        item.y += actualSpeed;

        const targetCar = item.side === 'left' ? leftCar : rightCar;

        // Memory state machine
        if (item.isMemory) {
            updateMemoryState(item, targetCar.y);
        }

        // Collision
        const dx = targetCar.currentX - item.x;
        const dy = targetCar.y - item.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < CAR_RADIUS + 15) {
            // Fake = always safe
            if (item.isFake) {
                createParticles(item.x, item.y, '#a855f7', 8);
                playSound(280, 0.08, 'sine', 0.04);
                items.splice(i, 1);
                continue;
            }
            // Memory in question = safe (player can't know)
            if (item.isMemory && item.state === 'question') {
                createParticles(item.x, item.y, '#f1c40f', 5);
                items.splice(i, 1);
                continue;
            }
            // Real item
            if (item.type === 'circle') {
                score++;
                scoreEl.innerText = score;
                flashScore();
                createParticles(item.x, item.y, item.side === 'left' ? '#ff3366' : '#00e5ff', 10);
                playSound(800, 0.1, 'sine', 0.07);
                shakeIntensity = Math.max(shakeIntensity, 4);
                items.splice(i, 1);
            } else {
                // Square = death
                createParticles(item.x, item.y, item.side === 'left' ? '#ff3366' : '#00e5ff', 20);
                endGame();
                return;
            }
            continue;
        }

        // Missed circle (immediate, when just passed car)
        if (!item.isFake && item.type === 'circle' && item.state !== 'question' && item.y > targetCar.y + 10) {
            endGame();
            return;
        }

        // Off-screen cleanup
        if (item.y > canvasHeight + 60) {
            items.splice(i, 1);
        }
    }
}

function flashScore() {
    scoreEl.classList.remove('flash');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('flash');
}

/* ===================== DRAW ===================== */
function drawCar(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowBlur = 18;
    ctx.shadowColor = color;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H, 8);
    ctx.fill();

    // Wheels
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 0;
    [[-CAR_W/2-3, -CAR_H/2+8], [CAR_W/2-3, -CAR_H/2+8],
     [-CAR_W/2-3, CAR_H/2-20], [CAR_W/2-3, CAR_H/2-20]].forEach(([wx, wy]) => {
        ctx.beginPath();
        ctx.roundRect(wx, wy, 6, 12, 3);
        ctx.fill();
    });

    // Windshield
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.roundRect(-CAR_W/2+5, -CAR_H/2+10, CAR_W-10, 15, 4);
    ctx.fill();

    ctx.restore();
}

function drawItems() {
    items.forEach(item => {
        ctx.save();
        const sideColor = item.side === 'left' ? '#ff3366' : '#00e5ff';

        if (item.isFake) {
            ctx.globalAlpha = 0.28 + Math.sin(frameCount * 0.12 + item.lane) * 0.04;
        }

        // Question mark
        if (item.isQuestion) {
            const pulse = 1 + Math.sin(frameCount * 0.15) * 0.15;
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#f1c40f';
            ctx.fillStyle = '#f1c40f';
            ctx.font = `bold ${34 * pulse}px Cairo, Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❓', item.x, item.y);
            ctx.restore();
            return;
        }

        if (item.type === 'circle') {
            ctx.shadowBlur = 18;
            ctx.shadowColor = sideColor;
            ctx.strokeStyle = sideColor;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 13, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = sideColor;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.shadowBlur = 18;
            ctx.shadowColor = sideColor;
            ctx.strokeStyle = sideColor;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.roundRect(item.x - 13, item.y - 13, 26, 26, 6);
            ctx.stroke();
            ctx.fillStyle = sideColor;
            ctx.beginPath();
            ctx.roundRect(item.x - 5, item.y - 5, 10, 10, 2);
            ctx.fill();
        }
        ctx.restore();
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    ctx.save();
    if (shakeIntensity > 0.5) {
        ctx.translate(
            (Math.random() - 0.5) * shakeIntensity,
            (Math.random() - 0.5) * shakeIntensity
        );
    }

    // Lane lines
    for (let i = 1; i < LANE_COUNT; i++) {
        if (i === 2) {
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,255,255,.22)';
        } else {
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255,255,255,.08)';
        }
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, canvasHeight);
        ctx.stroke();
    }

    drawItems();
    drawCar(leftCar.currentX, leftCar.y, leftCar.color);
    drawCar(rightCar.currentX, rightCar.y, rightCar.color);
    drawParticles();
    ctx.restore();

    // Flashes
    if (whiteFlash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, whiteFlash)})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    }
    if (redFlash > 0) {
        ctx.fillStyle = `rgba(255,30,60,${Math.min(0.4, redFlash)})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    }
}

/* ===================== LOOP ===================== */
function gameLoop() {
    update();
    draw();

    const hasEffects = particles.length > 0 || whiteFlash > 0 || redFlash > 0 || shakeIntensity > 0.5;

    if (isPlaying || hasEffects) {
        animationId = requestAnimationFrame(gameLoop);
    } else {
        animationId = null;
    }
}

/* ===================== HELPERS ===================== */
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}

/* ===================== INIT ===================== */
resizeCanvas();
updateStartScreen();
draw();
</script>
